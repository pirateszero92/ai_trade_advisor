name: ai_trade_advisor
description: "AI Trading Advisor with SMC analysis"
publish_to: 'none'
version: 1.0.14+32

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP + API
  dio: ^5.7.0
  retrofit: ^4.1.0

  # WebSocket
  web_socket_channel: ^3.0.1

  # Charting - Candlestick charts
  candlesticks: ^2.1.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Local storage
  shared_preferences: ^2.3.2

  # Firebase (FCM)
  firebase_core: ^3.4.1
  firebase_messaging: ^15.1.2

  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # UI
  fl_chart: ^0.68.0
  intl: ^0.19.0
  timeago: ^3.6.1

  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  retrofit_generator: ^9.7.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.4

flutter:
  uses-material-design: true
