version: "3.9"

services:
  # Nginx Frontend Web Application
  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: ai_trade_web
    ports:
      - "3000:80"
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # FastAPI Backend & SMC Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_trade_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ai_trade_postgres
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader_pass
      POSTGRES_DB: ai_trade_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d ai_trade_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache & PubSub
  redis:
    image: redis:7-alpine
    container_name: ai_trade_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
